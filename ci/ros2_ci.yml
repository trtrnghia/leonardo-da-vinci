name: ROS 2 Jazzy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip python3-pytest python3-numpy python3-serial
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --symlink-install

      - name: Run unit tests
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          colcon test
          colcon test-result --verbose
