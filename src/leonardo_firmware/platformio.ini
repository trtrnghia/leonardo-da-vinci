; PlatformIO Project Configuration for Leonardo da Vinci ESP32-S3 Firmware

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps = 
    madhephaestus/ESP32Servo@^3.0.5
